name: Build Telegram Clone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK packages and accept licenses
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleClone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
